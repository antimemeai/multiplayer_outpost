[package]
name = "outpost-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Standalone E2EE sidecar CLI, daemon, and MCP server for multiplayer.tech"
homepage = "https://multiplayer.tech"
repository = "https://github.com/antimemeai/multiplayer_outpost"

[[bin]]
name = "mp-outpost"
path = "src/main.rs"

[features]
packaged = []
test-tls-overrides = ["outpost-daemon/test-tls-overrides"]

[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/antimemeai/multiplayer_outpost/releases/download/v{ version }/mp-outpost-v{ version }-darwin-arm64.tar.gz"
bin-dir = "mp-outpost-v{ version }-darwin-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/antimemeai/multiplayer_outpost/releases/download/v{ version }/mp-outpost-v{ version }-linux-x86_64.tar.gz"
bin-dir = "mp-outpost-v{ version }-linux-x86_64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "https://github.com/antimemeai/multiplayer_outpost/releases/download/v{ version }/mp-outpost-v{ version }-linux-arm64.tar.gz"
bin-dir = "mp-outpost-v{ version }-linux-arm64/{ bin }{ binary-ext }"

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
getrandom = "0.4"
icu_normalizer.workspace = true
libc.workspace = true
mp-protocol.workspace = true
outpost-control = { path = "../outpost-control" }
outpost-core = { path = "../outpost-core" }
outpost-daemon = { path = "../outpost-daemon" }
outpost-mcp = { path = "../outpost-mcp" }
outpost-p2p = { path = "../outpost-p2p" }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio-rustls.workspace = true
tokio-websockets.workspace = true
