[workspace]
resolver = "2"
members = [
    "crates/mp-protocol",
    "crates/outpost-core",
    "crates/outpost-control",
    "crates/outpost-p2p",
    "crates/outpost-daemon",
    "crates/outpost-mcp",
    "crates/outpost-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
blake3 = "1.8"
bytes = "1.12"
ciborium = "0.2"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
icu_normalizer = "2.4"
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring"] }
libc = "0.2"
mp-protocol = { path = "crates/mp-protocol" }
proptest = "1.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["rt-multi-thread", "net", "sync", "time", "signal", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "sha1_smol", "getrandom"] }
webpki-roots = "1.0"
zeroize = "1.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
